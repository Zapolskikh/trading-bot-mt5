app:
  mode: "paper"            # "live" | "paper" | "backtest"
  shares:
    - symbol: US500.cash
      lots: 2.0
    - symbol: US100.cash
      lots: 0.6
    - symbol: US30.cash
      lots: 0.3
  consecutive_closes: 3
  base_timeframe: "M1"
  data_window: 500

risk:
  per_trade_pct: 0.5
  per_day_pct: 2.0
  max_active_trades: 4
  dynamic:
    enabled: false

metatrader:
  login:
  password:
  server: FTMO-Demo

telegram:
  enabled: true

journal:
  path: "./journal"
  rotate_daily: true
